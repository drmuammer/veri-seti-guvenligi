project:
  type: website
  output-dir: _site

website:
  title: "Veri Güvenliği"
  description: "Klinik araştırmacılar için veri kimliksizleştirme ve güvenlik rehberi"
  site-url: https://drmuammer.github.io/veri-seti-guvenligi/
  repo-url: https://github.com/drmuammer/veri-seti-guvenligi
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true

  navbar:
    background: "#0F172A"
    foreground: "#14B8A6"
    title: "🔐 Veri Güvenliği"
    left:
      - href: index.qmd
        text: Ana Sayfa
      - text: Rehber
        menu:
          - rehber/01-kimliksizlestirme.qmd
    right:
      - icon: github
        href: https://github.com/drmuammer/veri-seti-guvenligi
        aria-label: GitHub
      - icon: house
        href: https://muammerbeslen.com
        aria-label: Website

  sidebar:
    style: "docked"
    search: true
    background: light
    contents:
      - href: index.qmd
        text: "🏠 Ana Sayfa"
      - section: "📚 Rehber"
        contents:
          - href: rehber/01-kimliksizlestirme.qmd
            text: "1. Kimliksizleştirme"

  page-footer:
    left: "© 2026 Muammer Beslen, MD · [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"
    right:
      - icon: github
        href: https://github.com/drmuammer/veri-seti-guvenligi
      - text: muammerbeslen.com
        href: https://muammerbeslen.com

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "İçindekiler"
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
    anchor-sections: true
    fig-cap-location: bottom
    tbl-cap-location: top
    highlight-style: github
    citations-hover: true

bibliography: references.bib
csl: https://www.zotero.org/styles/vancouver

lang: tr
